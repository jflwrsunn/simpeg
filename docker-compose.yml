version: '3.8'

services:
  web:
    build: .
    ports:
      - "80:80"
    depends_on:
      - db
    volumes:
      - ./src:/var/www/html
    restart: always
    
  db:
    image: mariadb:10.5
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: simpeg_db
      MYSQL_USER: simpeg_user
      MYSQL_PASSWORD: simpeg_password
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: always